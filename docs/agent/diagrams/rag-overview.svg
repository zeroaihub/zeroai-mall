<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 672" width="680" height="672" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif">
  <title>RAG 架构总览</title>
  <desc>上半区是启动期的索引构建，下半区是对话期的检索与作答，中间以分隔线区分</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="672" fill="#FFFFFF"/>

  <rect x="220" y="44" width="240" height="44" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="66" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">知识语料 18 篇</text>

  <path d="M340 88 V112" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="112" width="300" height="44" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="134" text-anchor="middle" dominant-baseline="central" font-size="13" fill="#2C2C2A">校验 + 500 字切块 → 90 块</text>

  <path d="M340 156 V166 H195 V180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 166 H485 V180" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="70" y="180" width="250" height="52" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="195" y="198" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">ES 倒排索引</text>
  <text x="195" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">zeroai_ai_kb · IK 分词</text>

  <rect x="360" y="180" width="250" height="52" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="485" y="198" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">向量索引</text>
  <text x="485" y="218" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">90 块 × 1024 维 · 内存 / PG</text>

  <text x="48" y="250" font-size="11" fill="#888780">启动期 · 全量同步，sourceId 消失即删除</text>
  <line x1="40" y1="262" x2="640" y2="262" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="48" y="284" font-size="11" fill="#888780">对话期 · 每次提问，两路各取 Top3</text>

  <rect x="240" y="300" width="200" height="44" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="322" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">用户提问</text>

  <path d="M340 344 V368" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="180" y="368" width="320" height="52" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#2C2C2A">Agent 决定是否检索</text>
  <text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">调用 search_knowledge</text>

  <path d="M340 420 V444" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="444" width="440" height="52" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">KnowledgeService 门面</text>
  <text x="340" y="482" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">归一化 → 检索 → 去重 / 防注入 / 截断</text>

  <path d="M340 496 V506 H130 V520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 496 V520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 506 H550 V520" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="520" width="180" height="52" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="130" y="538" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">bm25</text>
  <text x="130" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">读 ES · 分数 ≥ 8.5</text>

  <rect x="250" y="520" width="180" height="52" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="538" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">vector</text>
  <text x="340" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">读索引 · 余弦 ≥ 0.65</text>

  <rect x="460" y="520" width="180" height="52" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="550" y="538" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">hybrid</text>
  <text x="550" y="558" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">两路 + RRF k=60</text>

  <path d="M130 572 V584 H340 V596" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M550 572 V584 H340" fill="none" stroke="#888780" stroke-width="1.5"/>
  <path d="M340 572 V596" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="596" width="380" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="614" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#0C447C">工具 JSON → 模型作答</text>
  <text x="340" y="634" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">OK 标出处 · NO_MATCH 查不到 · UNAVAILABLE 稍后</text>
</svg>
