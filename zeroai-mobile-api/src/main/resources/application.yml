server:
  port: 82
  shutdown: graceful # 优雅关机

spring:
  application:
    name: zeroai-mobile-api
  profiles:
    active: dev
  thymeleaf:
    cache: false
    suffix: .html
    check-template-location: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 5MB
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    default-property-inclusion: non_null # 接口返回字段值为null的属性不展示
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌秘钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30天）
  expireTime: 30

# 日志配置
logging:
  file:
    name: ${LOG_PATH_PREFIX:E:/home/logs}/${spring.application.name}/info.log

# mybatis plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag  # 全局逻辑删除字段值 3.3.0开始支持，详情看下面。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  # 搜索指定包别名
  typeAliasesPackage: com.zeroai.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml

# xml 文件热加载
mybatis-xml-reload:
  enabled: ${XML_RELOAD:false}
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# zeroai 配置
zeroai:
  name: zeroai-mall
  version: 1.3.0
  email: 166738430@qq.com
  uploadDir: ${UPLOAD_DIR:E:\zeroai-mall\webp}
  adminUrl: ${ADMIN_URL:http://localhost:81}
  mobileUrl: ${MOBILE_URL:http://localhost:82}
  freightLimit: "0"  # 运费限额
  freightPrice: "0"  # 运费
  unpaidOrderCancelDelayTime: 1 # 未支付订单超时时间
  # AI Agent 能力（enabled=false 时不加载任何 AI Bean，行为与接入前一致）
  ai:
    enabled: ${AI_ENABLED:false}
    # 引擎选择：spring-ai（单轮无工具） / agentscope（带只读商城工具）
    # 注意必须显式映射：Spring 的 relaxed binding 只认 ZEROAI_AI_ENGINE，
    # 不认 .env 里的 AI_ENGINE，缺这一行则环境变量写了也不生效
    engine: ${AI_ENGINE:spring-ai}
    provider: openai
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: 0.3
    max-tokens: 1024
    system-prompt: prompts/guide-system.st
    chat-path: /ai/chat
    sse-timeout-ms: 120000      # 显式设置，避免容器默认 30s 截断长回答
    max-steps: 6
    max-tool-calls-per-turn: 6
    max-history-turns: 8
    tool-timeout-ms: 3000
    degrade-on-error: true
    # 写操作提议（Human-in-the-loop）：Agent 只能生成待确认提议，
    # 真正的订单写入必须由用户在页面上点确认后走独立接口
    action:
      enabled: ${AI_ACTION_ENABLED:false}
      proposal-ttl-seconds: ${AI_ACTION_TTL_SECONDS:600}
      max-items-per-proposal: ${AI_ACTION_MAX_ITEMS:10}
    # 对话历史：本模块只负责调用存储 SPI，落库实现由入口模块提供（移动端落 ES）
    history:
      enabled: ${AI_HISTORY_ENABLED:true}
      index: ${AI_HISTORY_INDEX:zeroai_ai_chat}
      max-answer-chars: 8000
      default-page-size: 20
      max-page-size: 50
    # 知识库（RAG）：政策/规则类文档随代码打包，启动时同步到 ES 的独立索引；
    # 商品实时数据不复制进来
    knowledge:
      enabled: ${AI_KNOWLEDGE_ENABLED:true}
      # 检索模式：bm25（默认，ES 倒排）/ vector（纯向量）/ hybrid（两路 RRF 融合）
      # 默认 bm25 的理由：不依赖任何 embedding 服务即可回答政策问题
      mode: ${AI_KNOWLEDGE_MODE:bm25}
      index: ${AI_KNOWLEDGE_INDEX:zeroai_ai_kb}
      location: knowledge
      sync-on-startup: ${AI_KNOWLEDGE_SYNC_ON_STARTUP:true}
      max-hits: ${AI_KNOWLEDGE_MAX_HITS:3}
      max-snippet-chars: 600
      max-query-chars: 80
      # 覆盖率要求与得分下限：检索调优参数，改这里不用改代码
      min-should-match: ${AI_KNOWLEDGE_MIN_SHOULD_MATCH:2<70%}
      min-score: ${AI_KNOWLEDGE_MIN_SCORE:1.5}
      # 向量化服务（OpenAI 兼容 /v1/embeddings；仅 mode 非 bm25 时需要）。
      # 与对话模型是两套配置：DeepSeek 没有 embedding 接口，不能复用 LLM_API_KEY
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:}
        path: ${AI_EMBEDDING_PATH:/v1/embeddings}
        api-key: ${AI_EMBEDDING_API_KEY:}
        model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
        dimension: ${AI_EMBEDDING_DIMENSION:1024}
        timeout-ms: 5000
        max-chars: 1000
        batch-size: 16
      vector:
        # 余弦相似度下限。与上面的 min-score 量纲不同，不能互相套用
        min-score: ${AI_KNOWLEDGE_VECTOR_MIN_SCORE:0.55}
        chunk-size: 300
        min-chunk-chars: 60
        prefix-title: true
      hybrid:
        rrf-k: 60
        # 融合后阈值，默认 0：两路各自已过滤过低分，这里再设会误杀单路语义命中
        min-score: 0
        # 向量分支挂掉时是否退回纯 BM25
        fallback-to-bm25: true

