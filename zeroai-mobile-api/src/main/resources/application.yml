server:
  port: 82
  shutdown: graceful # 优雅关机

spring:
  application:
    name: zeroai-mobile-api
  profiles:
    active: dev
  # 本地开发读取仓库根的 .env（AI_ENABLED / LLM_* / AI_HISTORY_* 等开关都写在那里）。
  # Spring Boot 不认 .env 后缀，用 [.properties] 显式指定按 properties 解析；
  # optional: 保证文件不存在时静默跳过，不影响容器和线上启动。
  # 同时列两条的原因：IDEA 运行配置的工作目录可能是仓库根，也可能是模块目录，两条互为兜底。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  thymeleaf:
    cache: false
    suffix: .html
    check-template-location: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 5MB
      max-file-size: 200MB
      max-request-size: 200MB
  jackson:
    default-property-inclusion: non_null # 接口返回字段值为null的属性不展示
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  # P8 MCP Server：默认关闭。只读工具通过 /mcp 暴露，写工具永远不注册。
  ai:
    mcp:
      server:
        enabled: ${MCP_ENABLED:false}
        name: zeroai-mall
        version: 1.0.0
        protocol: streamable
        type: sync
        request-timeout: 10s
        instructions: >
          这是 zeroai-mall 的只读 MCP 服务。只能查询在售商品、商品详情、
          公开商城政策和当前 token 所属用户自己的订单。禁止尝试下单、支付、
          退款、改地址、扣库存或查询其他用户数据。
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: ${MCP_ENDPOINT:/mcp}
          disallow-delete: true
          keep-alive-interval: 30s
# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌秘钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30天）
  expireTime: 30

# 日志配置
logging:
  file:
    name: ${LOG_PATH_PREFIX:E:/home/logs}/${spring.application.name}/info.log

# mybatis plus 配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delFlag  # 全局逻辑删除字段值 3.3.0开始支持，详情看下面。
      logic-delete-value: 1 # 逻辑已删除值(默认为 1)
      logic-not-delete-value: 0 # 逻辑未删除值(默认为 0)
  # 搜索指定包别名
  typeAliasesPackage: com.zeroai.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml

# xml 文件热加载
mybatis-xml-reload:
  enabled: ${XML_RELOAD:false}
  mapper-locations: classpath*:mapper/**/*Mapper.xml

# zeroai 配置
zeroai:
  name: zeroai-mall
  version: 1.3.0
  email: 166738430@qq.com
  uploadDir: ${UPLOAD_DIR:E:\zeroai-mall\webp}
  adminUrl: ${ADMIN_URL:http://localhost:81}
  mobileUrl: ${MOBILE_URL:http://localhost:82}
  freightLimit: "0"  # 运费限额
  freightPrice: "0"  # 运费
  unpaidOrderCancelDelayTime: 1 # 未支付订单超时时间
  # AI Agent 能力（enabled=false 时不加载任何 AI Bean，行为与接入前一致）
  ai:
    enabled: ${AI_ENABLED:false}
    # 引擎选择：spring-ai（单轮无工具） / agentscope（带只读商城工具）
    # 注意必须显式映射：Spring 的 relaxed binding 只认 ZEROAI_AI_ENGINE，
    # 不认 .env 里的 AI_ENGINE，缺这一行则环境变量写了也不生效
    engine: ${AI_ENGINE:spring-ai}
    provider: openai
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: 0.3
    max-tokens: 1024
    system-prompt: prompts/guide-system.st
    chat-path: /ai/chat
    # 多步工具链（检索→详情→挑选→展示/下单）常见 60~90s，120s 会把接近完成的回答掐断，
    # 用户侧表现为「卡片出来了但对话没有结论」。给到 5 分钟，仍由客户端主动停止兜底
    sse-timeout-ms: 300000
    max-steps: 6
    max-tool-calls-per-turn: 6
    # 单轮 search_products 次数上限：基线里模型对稀疏结果会连搜 5 次，
    # 步数顶满、token 翻倍而答案没变好。这里是服务端确定性止损点。
    max-searches-per-turn: ${AI_MAX_SEARCHES_PER_TURN:3}
    max-history-turns: 8
    tool-timeout-ms: 3000
    degrade-on-error: true
    # P8 MCP Server：与 AI 对话开关分离，只读工具不依赖模型调用。
    # 默认仅允许本机访问；跨服务使用时必须经 TLS 反向代理、访问控制并显式打开 allow-remote。
    mcp:
      enabled: ${MCP_ENABLED:false}
      token-secret: ${MCP_TOKEN_SECRET:}
      token-header: Authorization
      token-prefix: Bearer
      max-token-ttl: 1h
      clock-skew: 60s
      allow-remote: ${MCP_ALLOW_REMOTE:false}
    # 写操作提议（Human-in-the-loop）：Agent 只能生成待确认提议，
    # 真正的订单写入必须由用户在页面上点确认后走独立接口
    action:
      enabled: ${AI_ACTION_ENABLED:false}
      proposal-ttl-seconds: ${AI_ACTION_TTL_SECONDS:600}
      max-items-per-proposal: ${AI_ACTION_MAX_ITEMS:10}
    # 对话历史：本模块只负责调用存储 SPI，落库实现由入口模块提供（移动端落 ES）
    history:
      enabled: ${AI_HISTORY_ENABLED:true}
      index: ${AI_HISTORY_INDEX:zeroai_ai_chat}
      max-answer-chars: 8000
      default-page-size: 20
      max-page-size: 50
    # 知识库（RAG）：政策/规则类文档随代码打包，启动时同步到 ES 的独立索引；
    # 商品实时数据不复制进来
    knowledge:
      enabled: ${AI_KNOWLEDGE_ENABLED:true}
      # 检索模式：bm25（默认，ES 倒排）/ vector（纯向量）/ hybrid（两路 RRF 融合）
      # 默认 bm25 的理由：不依赖任何 embedding 服务即可回答政策问题。
      # 启用 PGVector 需要同时改两个键：mode=vector + vector.store=pgvector，
      # 并保证 embedding 服务（本地 bge-m3）已启动，否则检索会返回「不可用」。
      mode: ${AI_KNOWLEDGE_MODE:bm25}
      index: ${AI_KNOWLEDGE_INDEX:zeroai_ai_kb}
      location: knowledge
      sync-on-startup: ${AI_KNOWLEDGE_SYNC_ON_STARTUP:true}
      max-hits: ${AI_KNOWLEDGE_MAX_HITS:3}
      max-snippet-chars: 600
      max-query-chars: 80
      # 覆盖率要求：短查询严格、长查询放宽。
      # 2~3 词要求 100%（两个词都必须命中），≥4 词要求 60%（容纳口语噪声）。
      # 为什么不是简单的 "3<70%"：中文口语问句常含「要/收/多少/时候」这类碎片词元，
      # 百分比会把它们算进分母（「安装师傅上门要收多少钱」切 6 个词 → 要求 5 个），
      # 实测直接零命中。阶梯写法让长查询只要求核心词命中。
      min-should-match: ${AI_KNOWLEDGE_MIN_SHOULD_MATCH:2<100% 4<60%}
      # BM25 得分下限。必须在真实 ES + IK 上标定，分数依赖分词与索引统计，
      # 不能用向量阈值推断，也不能用离线 bigram 代理代替。
      # 2026-11-25 实测（18 篇 / 90 块 / 30 条用例）：可答 top1 中位 18.6，
      # 库外最高 12.4。8.0~9.0 是零误召回平台区，取中点 8.5。
      # 注意：这个高阈值是为 hybrid 设计的——BM25 只报高置信命中，
      # 长尾召回交给向量分支。向量服务不可用时退回纯 BM25，召回会明显下降
      # （实测训练集 13/22），这是有意的取舍，不是缺陷。
      min-score: ${AI_KNOWLEDGE_MIN_SCORE:8.5}
      # 向量化服务（OpenAI 兼容 /v1/embeddings；仅 mode 非 bm25 时需要）。
      # 与对话模型是两套配置：DeepSeek 没有 embedding 接口，不能复用 LLM_API_KEY
      embedding:
        base-url: ${AI_EMBEDDING_BASE_URL:}
        path: ${AI_EMBEDDING_PATH:/v1/embeddings}
        api-key: ${AI_EMBEDDING_API_KEY:}
        model: ${AI_EMBEDDING_MODEL:text-embedding-v3}
        dimension: ${AI_EMBEDDING_DIMENSION:1024}
        # 本地 bge-m3 冷加载实测 9.7s，5s 会导致开机首次启动必然超时降级回 BM25
        timeout-ms: ${AI_EMBEDDING_TIMEOUT_MS:20000}
        max-chars: 1000
        batch-size: 16
      vector:
        # 向量存储实现：memory（进程内索引，默认）/ pgvector（PG 持久化）。
        # 二选一装配：同时存在两个候选会让检索路由在注入时直接失败。
        store: ${AI_KNOWLEDGE_VECTOR_STORE:memory}
        # 余弦相似度下限。2026-11-25 用真实 bge-m3 + 18 篇语料 + 30 条用例实测：
        #   可答 22 条 top1：0.605 / 0.658(p25) / 0.726(中位) / 0.775 / 0.799
        #   库外  8 条 top1：0.435 / 0.586(中位) / 0.595 / 0.648(最高)
        # 0.65 也是 hybrid 下唯一「零误召回」的点：0.60~0.64 会把「可以开发票吗」
        # 「支持货到付款吗」放进结果。留出集 14 条新问法验证：hit@3 8/10、误召回 0/4。
        # 掉出的 4 条（七天无理由/随心换/售后入口/取消安装）都是字面强命中的问题，
        # 由 hybrid 的 BM25 分支兜底；纯向量模式下这是已知缺口。
        min-score: ${AI_KNOWLEDGE_VECTOR_MIN_SCORE:0.65}
        # 售后语料一条规则常含「条件 + 时效 + 例外」，300 字会切在规则中间。
        # 18 篇文档实测：500 字 90 块、300 字 152 块，两种规模对内存与 PG 都很轻。
        chunk-size: ${AI_KNOWLEDGE_CHUNK_SIZE:500}
        min-chunk-chars: 120
        prefix-title: true
      # PGVector 连接（仅 vector.store=pgvector 时使用）。
      # 密码只从环境变量注入，禁止写进仓库；账号建议只对本表有读写权限。
      pg:
        url: ${AI_KNOWLEDGE_PG_URL:jdbc:postgresql://127.0.0.1:5432/zeroai_ai}
        username: ${AI_KNOWLEDGE_PG_USER:zeroai}
        password: ${AI_KNOWLEDGE_PG_PASSWORD:}
        table: ${AI_KNOWLEDGE_PG_TABLE:ai_knowledge_chunk}
        pool-size: ${AI_KNOWLEDGE_PG_POOL_SIZE:4}
        connection-timeout-ms: 3000
        query-timeout-seconds: 5
        visibility: ${AI_KNOWLEDGE_PG_VISIBILITY:public}
      hybrid:
        rrf-k: 60
        # 融合后阈值，默认 0：两路各自已过滤过低分，这里再设会误杀单路语义命中
        min-score: 0
        # BM25 零命中时向量分支的最低余弦分：语义是唯一证据，必须更强才算数。
        # 2026-11-25 实测：0.65 与 vector.min-score 对齐后，8 条库外问题零误召回；
        # 降到 0.60 会把「可以开发票吗」等放进结果。两道门设成同值是刻意的——
        # 向量只有在「自己足够自信」时才能单独支撑一个答案。
        vector-only-min-score: ${AI_KNOWLEDGE_VECTOR_ONLY_MIN_SCORE:0.65}
        # 向量分支挂掉时是否退回纯 BM25
        fallback-to-bm25: true

